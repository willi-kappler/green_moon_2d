[project]
version = "0.1"
name = "GreenMoon2D"
dependencies = [
    "pygame-ce >= 2.4.1"
]
requires-python = ">= 3.12"
readme = "README.md"
description = "A 2D game engine for Python"
maintainers = [
  {name = "Willi Kappler", email = "grandor@gmx.de"}
]
authors = [
  {name = "Willi Kappler", email = "grandor@gmx.de"},
  {name = "Manuel Kappler"}
]
keywords = ["2D", "game", "engine"]
license = {text = "MIT License"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12"
]

[project.urls]
Repository = "https://github.com/willi-kappler/green_moon_2d"

